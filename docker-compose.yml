services:
  lawmind-postgres:
    image: postgres:16-alpine
    container_name: lawmind-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${LAWMIND_DB_USER:-lawuser}
      POSTGRES_PASSWORD: ${LAWMIND_DB_PASSWORD:-REPLACE_ME_DB_PASSWORD}
      POSTGRES_DB: ${LAWMIND_DB_NAME:-lawmind_law}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  lawmind-redis:
    image: redis:7-alpine
    container_name: lawmind-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-REPLACE_ME_REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-REPLACE_ME_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  lawmind-chromadb:
    image: chromadb/chroma:0.5.23
    container_name: lawmind-chromadb
    ports:
      - "8003:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  lawmind-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: lawmind-api
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-REPLACE_ME_REDIS_PASSWORD}@lawmind-redis:6379/0"
      CHROMA_HOST: lawmind-chromadb
      CHROMA_PORT: "8000"
      DATABASE_URL: "postgresql://${LAWMIND_DB_USER:-lawuser}:${LAWMIND_DB_PASSWORD:-REPLACE_ME_DB_PASSWORD}@lawmind-postgres:5432/${LAWMIND_DB_NAME:-lawmind_law}"
      LAWMIND_SESSION_SECRET: "${LAWMIND_SESSION_SECRET:-}"
      LAWMIND_ADMIN_PASSWORD: "${LAWMIND_ADMIN_PASSWORD:-REPLACE_ME_ADMIN_PASSWORD}"
      LAWMIND_SKILLS_DIR: /app/skills/law_firm
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-REPLACE_ME_ANTHROPIC_API_KEY}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-deepseek-v4-pro}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}"
      APP_ENV: "${APP_ENV:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      # Chroma downloads its default embedding model (~79MB) from inside this
      # container and the download has no resume, so every recreate re-fetches it
      # and startup can hang on a slow link. Keep the cache in a named volume.
      - chroma-onnx-cache:/home/lawmind/.cache/chroma
    depends_on:
      lawmind-postgres:
        condition: service_healthy
      lawmind-redis:
        condition: service_healthy
      lawmind-chromadb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # A cold cache still has to fetch the embedding model before /health can
      # pass; 60s was short enough to mark the API unhealthy mid-download.
      start_period: 300s

  lawmind-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lawmind-frontend
    restart: unless-stopped

  lawmind-nginx:
    image: nginx:1.27-alpine
    container_name: lawmind-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      lawmind-api:
        condition: service_healthy
      lawmind-frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  chromadb-data:
  chroma-onnx-cache:
