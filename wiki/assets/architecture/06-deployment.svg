<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 800 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #16233d; }
      .sub { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #66738a; }
      .box { fill: #fff; stroke: #cfd8e8; stroke-width: 1.5; rx: 14; }
      .blue { fill: #e8f1ff; stroke: #6aa0ff; }
      .green { fill: #eaf8f0; stroke: #55bd7f; }
      .orange { fill: #fff3e3; stroke: #f2a33a; }
      .purple { fill: #f1ecff; stroke: #9b7cf4; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #20304a; }
      .small { font: 400 12px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60708a; }
      .arrow { stroke: #7b8aa3; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8aa3"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="620"/>
<text class="title" x="40" y="52">LawMind Docker Compose 部署</text><text class="sub" x="40" y="78">一条命令启动 Nginx + Frontend + API + PostgreSQL + Redis + ChromaDB</text>
<rect class="blue" x="190" y="110" width="620" height="60" rx="14"/><text class="label" x="500.0" y="142" text-anchor="middle">docker compose up -d --build</text><text class="small" x="500.0" y="165" text-anchor="middle">LawMind 联合部署</text><path class="arrow" d="M500 170 L500 205"/><rect class="green" x="190" y="215" width="180" height="60" rx="14"/><text class="label" x="280.0" y="247" text-anchor="middle">lawmind-nginx</text><text class="small" x="280.0" y="270" text-anchor="middle">:80</text><rect class="blue" x="410" y="215" width="180" height="60" rx="14"/><text class="label" x="500.0" y="247" text-anchor="middle">lawmind-frontend</text><text class="small" x="500.0" y="270" text-anchor="middle">Vue SPA</text><rect class="purple" x="630" y="215" width="180" height="60" rx="14"/><text class="label" x="720.0" y="247" text-anchor="middle">lawmind-api</text><text class="small" x="720.0" y="270" text-anchor="middle">FastAPI</text><path class="arrow" d="M370 245 L410 245"/><path class="arrow" d="M590 245 L630 245"/><rect class="green" x="190" y="330" width="180" height="60" rx="14"/><text class="label" x="280.0" y="362" text-anchor="middle">lawmind-postgres</text><text class="small" x="280.0" y="385" text-anchor="middle">:5433</text><rect class="orange" x="410" y="330" width="180" height="60" rx="14"/><text class="label" x="500.0" y="362" text-anchor="middle">lawmind-redis</text><text class="small" x="500.0" y="385" text-anchor="middle">:6379</text><rect class="purple" x="630" y="330" width="180" height="60" rx="14"/><text class="label" x="720.0" y="362" text-anchor="middle">lawmind-chromadb</text><text class="small" x="720.0" y="385" text-anchor="middle">:8003</text><path class="arrow" d="M500 275 L500 330"/><rect class="green" x="190" y="450" width="620" height="60" rx="14"/><text class="label" x="500.0" y="482" text-anchor="middle">数据卷</text><text class="small" x="500.0" y="505" text-anchor="middle">postgres-data / redis-data / chromadb-data</text>
</svg>
