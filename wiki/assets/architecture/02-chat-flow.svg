<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 800 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #16233d; }
      .sub { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #66738a; }
      .box { fill: #fff; stroke: #cfd8e8; stroke-width: 1.5; rx: 14; }
      .blue { fill: #e8f1ff; stroke: #6aa0ff; }
      .green { fill: #eaf8f0; stroke: #55bd7f; }
      .orange { fill: #fff3e3; stroke: #f2a33a; }
      .purple { fill: #f1ecff; stroke: #9b7cf4; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #20304a; }
      .small { font: 400 12px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60708a; }
      .arrow { stroke: #7b8aa3; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8aa3"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="620"/>
